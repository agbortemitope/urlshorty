# Test configuration: a separate in-memory database, created and dropped for every test run.
spring:
  datasource:
    url: jdbc:h2:mem:urlshorty-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: false

logging:
  level:
    com.urlshorty: WARN
    org.hibernate.SQL: WARN
