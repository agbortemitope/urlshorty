# Optional production profile: run with --spring.profiles.active=mysql
# Every value can be overridden with an environment variable, so no credentials live in the file.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/urlshorty?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:urlshorty}
    password: ${DB_PASSWORD:urlshorty}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: false
